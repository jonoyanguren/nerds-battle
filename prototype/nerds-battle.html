<style>
/* ============================================================
   NERDS BATTLE — prototipo v0.1
   Tokens. Tema único (marcador de pabellón), pintado explícito.
   ============================================================ */
:root{
  --ground:#0B0E13;
  --panel:#141A23;
  --panel-2:#1B222D;
  --line:#28313E;
  --ink:#EEF2F7;
  --muted:#8A97A9;
  --accent:#FF7A2F;      /* ámbar de marcador */
  --accent-dim:#B4541F;
  --good:#3DDC97;
  --bad:#FF4D5E;
  --display:"Anton", "Arial Narrow", system-ui, sans-serif;
  --body:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", monospace;
  --r:10px;
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#root{max-width:940px;margin:0 auto;padding:28px 20px 64px}

/* --- cabecera --- */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:24px}
.wordmark{font-family:var(--display);font-size:clamp(34px,7vw,52px);line-height:.9;letter-spacing:.01em;margin:0}
.wordmark em{font-style:normal;color:var(--accent)}
.league{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.scoreboard-mini{display:flex;gap:20px;font-family:var(--mono);font-size:11px;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase}
.scoreboard-mini b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);
  letter-spacing:.02em;font-weight:400;font-variant-numeric:tabular-nums}

/* --- panel de reto --- */
.challenge{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 22px 20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.stat-name{font-family:var(--display);font-size:clamp(26px,5vw,38px);line-height:1;margin:8px 0 6px}
.stat-note{color:var(--muted);font-size:13px;max-width:46ch}
.target{text-align:right}
.target span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.target b{font-family:var(--display);font-size:clamp(38px,9vw,60px);line-height:.95;font-weight:400;
  color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* --- slots --- */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0 18px}
.slot{background:var(--panel-2);border:1px dashed var(--line);border-radius:var(--r);
  min-height:104px;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;
  text-align:center;transition:border-color .15s,background .15s}
.slot.filled{border-style:solid;border-color:var(--line);background:var(--panel)}
.slot.revealed{border-color:var(--accent-dim)}
.slot-no{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.15em}
.slot-name{font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.slot-empty{color:var(--muted);font-size:12px}
.slot-value{font-family:var(--display);font-size:21px;font-weight:400;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.slot-drop{font-family:var(--mono);font-size:11px;color:var(--muted)}
.slot-x{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:11px;
  cursor:pointer;padding:2px;letter-spacing:.1em}
.slot-x:hover{color:var(--bad)}

/* --- buscador --- */
.picker{position:relative}
.picker input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
  color:var(--ink);font-family:var(--body);font-size:15px;padding:13px 14px}
.picker input::placeholder{color:var(--muted)}
.picker input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.picker input:disabled{opacity:.45}
.results{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);max-height:262px;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 18px 40px rgba(0,0,0,.55)}
.results button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;
  background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);
  font-family:var(--body);font-size:14px;text-align:left;padding:11px 14px;cursor:pointer}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.cursor{background:var(--panel-2);color:var(--accent)}
.results .tag{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em}
.no-hit{padding:12px 14px;color:var(--muted);font-size:13px}

/* --- acciones --- */
.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:13px 22px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#160A03;font-weight:600}
.btn.primary:hover:not(:disabled){background:#FF8D4C;border-color:#FF8D4C;color:#160A03}
.hint{color:var(--muted);font-size:12.5px}

/* --- resultado --- */
.result{margin-top:24px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.result-top{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel)}
.result-cell{padding:16px 18px;border-right:1px solid var(--line)}
.result-cell:last-child{border-right:0}
.result-cell span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.result-cell b{font-family:var(--display);font-size:30px;font-weight:400;line-height:1;
  font-variant-numeric:tabular-nums}
.verdict{background:var(--panel-2);padding:16px 18px;display:flex;align-items:baseline;
  justify-content:space-between;gap:14px;flex-wrap:wrap}
.verdict-title{font-family:var(--display);font-size:24px;line-height:1}
.verdict-line{color:var(--muted);font-size:13px}
.bar{height:5px;background:var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .8s cubic-bezier(.2,.8,.2,1)}

footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:12px;line-height:1.7}
footer code{font-family:var(--mono);font-size:11.5px;color:#B9C4D3}

@media (max-width:720px){
  .challenge{grid-template-columns:1fr}
  .target{text-align:left}
  .slots{grid-template-columns:repeat(2,1fr)}
  .result-top{grid-template-columns:1fr;}
  .result-cell{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    s.split(",").map(p => {
      const i = p.lastIndexOf(":");
      return { name: p.slice(0, i), value: +p.slice(i + 1) };
    })
  ])
);

/* ============================================================
   2. MOTOR  —  funciones puras, sin React. Aquí vive el juego.
   ============================================================ */
const SLOTS = 5;

const fold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const fmt  = n => n.toLocaleString("es-ES");

/** Redondea a 3 cifras significativas: 46.291 -> 46.300 */
function roundNice(n) {
  const mag = Math.pow(10, Math.floor(Math.log10(n)) - 2);
  return Math.round(n / mag) * mag;
}

/** Un reto siempre es alcanzable: el objetivo sale de 5 jugadores reales del pool. */
function makeChallenge(prevStatId) {
  const pool = STATS.filter(s => s.id !== prevStatId);
  const stat = pool[Math.floor(Math.random() * pool.length)];
  const list = PLAYERS[stat.id];
  const idx = new Set();
  while (idx.size < SLOTS) idx.add(Math.floor(Math.random() * list.length));
  const seed = [...idx].reduce((a, i) => a + list[i].value, 0);
  return { stat, target: roundNice(seed) };
}

const VERDICTS = [
  { max:0.01, title:"Nerd supremo",     line:"Menos de un 1% de error. Esto no es suerte." },
  { max:0.03, title:"Enciclopedia",     line:"Te sabes los números, no solo los nombres." },
  { max:0.07, title:"Buen ojo",         line:"Ahí o ahí. Un jugador más fino y la clavas." },
  { max:0.15, title:"Aficionado",       line:"Sabes quién es quién, pero no cuánto." },
  { max:Infinity, title:"Fuera de rango", line:"Te has ido lejos. Mira las cifras y vuelve." }
];

function scoreRound(total, target) {
  const diff = total - target;
  const err  = Math.abs(diff) / target;
  const points = Math.max(0, Math.round(1000 * (1 - err * 5)));
  const verdict = VERDICTS.find(v => err <= v.max);
  return { diff, err, points, verdict };
}

/* --- récord local, best-effort --- */
const STORE_KEY = "nerds-battle-v1";
const loadStats = () => {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { rounds:0, best:0, sum:0 }; }
  catch { return { rounds:0, best:0, sum:0 }; }
};
const saveStats = s => { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch {} };

/* ============================================================
   3. UI
   ============================================================ */
function Slot({ n, pick, revealed, onRemove }) {
  const cls = "slot" + (pick ? " filled" : "") + (revealed ? " revealed" : "");
  return (
    <div className={cls}>
      <div className="slot-no">{String(n + 1).padStart(2, "0")}</div>
      {pick
        ? <div className="slot-name">{pick.name}</div>
        : <div className="slot-empty">vacío</div>}
      {revealed && pick
        ? <div className="slot-value">{fmt(pick.value)}</div>
        : pick
          ? <button className="slot-x" onClick={onRemove}>QUITAR</button>
          : <div className="slot-drop">—</div>}
    </div>
  );
}

function Picker({ statId, picks, onPick, disabled }) {
  const [q, setQ] = useState("");
  const [cursor, setCursor] = useState(0);
  const taken = useMemo(() => new Set(picks.filter(Boolean).map(p => p.name)), [picks]);

  const hits = useMemo(() => {
    const needle = fold(q.trim());
    if (!needle) return [];
    return PLAYERS[statId]
      .filter(p => !taken.has(p.name) && fold(p.name).includes(needle))
      .slice(0, 40);
  }, [q, statId, taken]);

  useEffect(() => { setCursor(0); }, [q]);
  useEffect(() => { setQ(""); }, [statId]);

  const choose = p => { onPick(p); setQ(""); };

  const onKey = e => {
    if (!hits.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); setCursor(c => Math.min(c + 1, hits.length - 1)); }
    if (e.key === "ArrowUp")   { e.preventDefault(); setCursor(c => Math.max(c - 1, 0)); }
    if (e.key === "Enter")     { e.preventDefault(); choose(hits[cursor]); }
    if (e.key === "Escape")    { setQ(""); }
  };

  return (
    <div className="picker">
      <input
        value={q}
        onChange={e => setQ(e.target.value)}
        onKeyDown={onKey}
        disabled={disabled}
        placeholder={disabled ? "Ronda cerrada" : "Busca un jugador y colócalo en un hueco…"}
        aria-label="Buscar jugador"
      />
      {q.trim() && !disabled && (
        <div className="results">
          {hits.length === 0
            ? <div className="no-hit">Ningún jugador del ranking coincide con «{q}».</div>
            : hits.map((p, i) => (
                <button key={p.name} className={i === cursor ? "cursor" : ""}
                        onMouseEnter={() => setCursor(i)} onClick={() => choose(p)}>
                  <span>{p.name}</span>
                  <span className="tag">#{PLAYERS[statId].indexOf(p) + 1} DEL RANKING</span>
                </button>
              ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [challenge, setChallenge] = useState(() => makeChallenge(null));
  const [picks, setPicks] = useState(Array(SLOTS).fill(null));
  const [shown, setShown] = useState(0);           // cuántos slots se han revelado
  const [phase, setPhase] = useState("picking");   // picking | revealing | done
  const [stats, setStats] = useState(loadStats);
  const timers = useRef([]);

  const filled = picks.filter(Boolean).length;
  const total = picks.reduce((a, p, i) => a + (p && i < shown ? p.value : 0), 0);
  const finalTotal = picks.reduce((a, p) => a + (p ? p.value : 0), 0);
  const result = phase === "done" ? scoreRound(finalTotal, challenge.target) : null;

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const place = p => {
    const i = picks.findIndex(x => !x);
    if (i === -1) return;
    const next = [...picks]; next[i] = p; setPicks(next);
  };

  const remove = i => {
    const next = [...picks]; next[i] = null; setPicks(next);
  };

  const reveal = () => {
    setPhase("revealing");
    timers.current = picks.map((_, i) =>
      setTimeout(() => {
        setShown(i + 1);
        if (i === SLOTS - 1) {
          setPhase("done");
          const r = scoreRound(finalTotal, challenge.target);
          setStats(s => {
            const next = { rounds:s.rounds + 1, best:Math.max(s.best, r.points), sum:s.sum + r.points };
            saveStats(next); return next;
          });
        }
      }, 380 * (i + 1))
    );
  };

  const nextRound = () => {
    timers.current.forEach(clearTimeout);
    setChallenge(makeChallenge(challenge.stat.id));
    setPicks(Array(SLOTS).fill(null));
    setShown(0);
    setPhase("picking");
  };

  const avg = stats.rounds ? Math.round(stats.sum / stats.rounds) : 0;

  return (
    <>
      <header className="masthead">
        <div>
          <div className="league">Sports · NBA · Carrera</div>
          <h1 className="wordmark">NERDS <em>BATTLE</em></h1>
        </div>
        <div className="scoreboard-mini">
          <div>Récord<b>{stats.best}</b></div>
          <div>Media<b>{avg}</b></div>
          <div>Rondas<b>{stats.rounds}</b></div>
        </div>
      </header>

      <section className="challenge">
        <div>
          <div className="eyebrow">Reto · 5 jugadores</div>
          <h2 className="stat-name">{challenge.stat.label} en carrera</h2>
          <p className="stat-note">{challenge.stat.note} Suma cinco jugadores y acércate al objetivo. No verás sus cifras hasta el final.</p>
        </div>
        <div className="target">
          <span>Objetivo</span>
          <b>{fmt(challenge.target)}</b>
        </div>
      </section>

      <div className="slots">
        {picks.map((p, i) => (
          <Slot key={i} n={i} pick={p} revealed={i < shown} onRemove={() => remove(i)} />
        ))}
      </div>

      <Picker statId={challenge.stat.id} picks={picks} onPick={place} disabled={phase !== "picking"} />

      <div className="actions">
        {phase === "done"
          ? <button className="btn primary" onClick={nextRound}>Nuevo reto</button>
          : <button className="btn primary" onClick={reveal} disabled={filled < SLOTS || phase !== "picking"}>
              Revelar cifras
            </button>}
        {phase === "picking" && (
          <span className="hint">
            {filled < SLOTS
              ? `${SLOTS - filled} ${SLOTS - filled === 1 ? "hueco" : "huecos"} por rellenar`
              : "Cinco elegidos. Cuando quieras."}
          </span>
        )}
        {phase === "revealing" && <span className="hint">Sumando… {fmt(total)}</span>}
      </div>

      {result && (
        <section className="result">
          <div className="result-top">
            <div className="result-cell">
              <span>Tu suma</span>
              <b>{fmt(finalTotal)}</b>
            </div>
            <div className="result-cell">
              <span>Diferencia</span>
              <b style={{ color: result.diff === 0 ? "var(--good)" : result.diff > 0 ? "var(--accent)" : "var(--bad)" }}>
                {result.diff > 0 ? "+" : ""}{fmt(result.diff)}
              </b>
            </div>
            <div className="result-cell">
              <span>Puntos</span>
              <b style={{ color:"var(--good)" }}>{result.points}</b>
            </div>
          </div>
          <div className="bar"><i style={{ width: `${result.points / 10}%` }}></i></div>
          <div className="verdict">
            <div className="verdict-title">{result.verdict.title}</div>
            <div className="verdict-line">
              {result.verdict.line} Error del {(result.err * 100).toFixed(1)}%.
            </div>
          </div>
        </section>
      )}

      <footer>
        Prototipo v0.1 · un jugador · datos de carrera NBA (temporada regular, top 100 de cada categoría, Basketball-Reference).<br />
        El objetivo de cada reto se genera sumando cinco jugadores reales del ranking, así que siempre hay una combinación que lo clava.<br />
        Para enchufar datos reales: sustituye <code>RAW</code> por tu fuente. El motor solo consume <code>PLAYERS[statId] = [&#123;name, value&#125;]</code>.
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
